version: '3'

services:

  demo-db:
    image: postgres

    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "root"]
      timeout: 45s
      interval: 10s
      retries: 5
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=city-db
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    container_name: demo-db

  demo-be:
    image: assignment1
    restart: always
    ports:
      - "8080:8080"
    environment:
      #- DB_IP=172.22.0.2
      - DB_IP=demo-db
      - RABBIT_IP=rabbitmq
      - DB_PORT=5432
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_DBNAME=city-db
    depends_on:
      demo-db:
        condition: service_healthy

  frontend:
    image: frontend
    restart: always
    ports:
      - "3000:3000"

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.11-management
    ports:
      - '5672:5672'
      - '15672:15672'
  
  rpc-server:
    image: rpc-server
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_HOST=demo-db
